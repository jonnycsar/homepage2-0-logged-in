<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <link rel="stylesheet" href="_ds/nalu-design-system-1-19-0-6a9729cb-285a-4454-aa9e-5f741f1913e2/colors_and_type.css">
  <link rel="stylesheet" href="components/fig-tokens.css">
  <link rel="stylesheet" href="components/fig-typography.css">
  <link rel="stylesheet" href="components/fig-assets.css">
  <style>
    body { margin: 0; }
    a { color: rgb(244,81,30); text-decoration: none; }
    a:hover { color: rgb(214,60,14); }
  </style>
</helmet>
<div style="min-height: 100vh; display: flex; justify-content: center; background: {{ stageBg }}; padding: 0;">
  <sc-if value="{{ framed }}" hint-placeholder-val="{{ false }}">
    <div style="width: 402px; flex-shrink: 0; border-radius: 40px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.22), 0 0 0 10px #0d0d0d;">
      <x-import component-from-global-scope="IPhone1718" from="./components/Components.bundle.js?v=4" hint-size="402px,3220px"></x-import>
    </div>
  </sc-if>
  <sc-if value="{{ bare }}" hint-placeholder-val="{{ true }}">
    <x-import component-from-global-scope="IPhone1718" from="./components/Components.bundle.js?v=4" hint-size="402px,3220px"></x-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:3220},&quot;deviceFrame&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentation&quot;},&quot;stageBackground&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e9e9ea&quot;,&quot;options&quot;:[&quot;#e9e9ea&quot;,&quot;#ffffff&quot;,&quot;#0d0d0d&quot;,&quot;#fbe9e3&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Presentation&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const framed = this.props.deviceFrame ?? false;
    return {
      framed,
      bare: !framed,
      stageBg: this.props.stageBackground ?? "#e9e9ea",
    };
  }
}
</script>
</body>
</html>
